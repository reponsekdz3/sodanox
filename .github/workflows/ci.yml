name: Sodanox CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Web typecheck, tests and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install application dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript validation
        run: bun run lint
      - name: Unit and security tests
        run: bun run test
      - name: Production bundle
        run: bun run build

  functions:
    name: Firebase Functions typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package.json
      - name: Install server dependencies
        run: npm install --no-audit --no-fund
      - name: Build callable functions and webhook
        run: npm run build

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="auraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3E33"/>
      <stop offset="50%" stop-color="#3B5244"/>
      <stop offset="100%" stop-color="#4F6E5C"/>
    </linearGradient>
    <linearGradient id="auraRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5C4B4"/>
      <stop offset="100%" stop-color="#E2EDE7"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe padding -->
  <rect width="512" height="512" rx="128" fill="url(#auraBg)"/>

  <!-- Concentric Zen Rings representing Calm & Community -->
  <circle cx="256" cy="256" r="160" stroke="#8FA89B" stroke-width="8" stroke-dasharray="24 16" fill="none" opacity="0.4"/>
  <circle cx="256" cy="256" r="115" stroke="url(#auraRing)" stroke-width="12" fill="none" filter="url(#softGlow)"/>
  
  <!-- Aura Center Core -->
  <circle cx="256" cy="256" r="60" fill="url(#auraRing)"/>
  <circle cx="240" cy="240" r="18" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="270" cy="270" r="8" fill="#FFFFFF" opacity="0.6"/>
</svg>
